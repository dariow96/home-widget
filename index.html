<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Landing</title>

     <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">


    <!-- =========================================================
         STYLES11
    ========================================================== -->

    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: transparent;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           LANDING
        ====================================================== */

        .landing-widget {
            position: relative;

            width: 100vw;
            height: 100%;
            height: 100vh;

            overflow: hidden;

            background: #000;
        }


        /* =====================================================
           BACKGROUND VIDEO
        ====================================================== */

.landing-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    overflow: hidden;
}

.landing-video iframe {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 100vw;
    height: 56.25vw;

    min-width: 177.78vh;
    min-height: 100vh;

    transform: translate(-50%, -50%);

    border: 0;
    pointer-events: none;
}

        /* =====================================================
           VIDEO OVERLAY
           
           Change the 0.15 value if you want:
           
           darker:
           rgba(0, 0, 0, 0.30)

           lighter:
           rgba(0, 0, 0, 0.05)

           completely transparent:
           rgba(0, 0, 0, 0)
        ====================================================== */

        .landing-overlay {
            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.15);

            z-index: 1;

            pointer-events: none;
        }


        /* =====================================================
           CONTENT
        ====================================================== */

        .landing-content {
            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            z-index: 2;
        }


        /* =====================================================
           TITLE
           
           BASE CARD FONT SIZE:
           Change this value if you want to establish
           another base size.

           LANDING TITLE:
           2.5 × this size.
        ====================================================== */

        .landing-title {
            display: block;
            font-family: 'Poppins', sans-serif;
            font-style: normal;
            font-weight: 700;
            font-size: clamp(54px, 6.5vw, 150px);
            line-height: 0.95;
            letter-spacing: -0.025em;
            color: #ffffff;
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            background: linear-gradient(
            180deg,
            #ffffff 0%,
            #ffffff 42%,
            #d8d8d8 100%
    );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0.5px rgba(255,255,255,0.45);
            filter:
                drop-shadow(0 3px 5px rgba(0,0,0,0.30))
                drop-shadow(0 12px 20px rgba(0,0,0,0.35))
                drop-shadow(0 25px 45px rgba(0,0,0,0.25));
        }


        /* =====================================================
           OVAL LINK
        ====================================================== */

        .enlace-ovalo {
            position: absolute;

            left: 50%;

            /*
             * Distance below the title.
             * The oval is positioned relative to the
             * center of the screen.
             */
            top: calc(50% + 200px);

            transform: translateX(-50%);

            display: flex;

            justify-content: center;
            align-items: center;

            text-decoration: none;

            z-index: 10;

            cursor: pointer;
        }


        /* =====================================================
           OVAL
        ====================================================== */

        .ovalo {
            position: relative;

            width: 30px;
            height: 65px;

            background-color: transparent;

            border: 5px solid #ffffff;

            border-radius: 30%;

            overflow: hidden;

            box-sizing: border-box;
        }


        /* =====================================================
           MOVING DOT
        ====================================================== */

.punto-central {
    position: absolute;

    top: 25%;
    left: 50%;

    width: 20px;
    height: 20px;

    color: #ffffff;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 20px;

    text-align: center;

    transform: translate(-50%, -50%) rotate(90deg);

    animation: moverAbajo 1s ease-in-out infinite;

    pointer-events: none;
}


        /* =====================================================
           OVAL ANIMATION
        ====================================================== */

@keyframes moverAbajo {
    0% {
        transform: translate(-50%, -50%) rotate(90deg);
        opacity: 1;
    }

    70% {
        transform: translate(-50%, 15px) rotate(90deg);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, 25px) rotate(90deg);
        opacity: 0;
    }
}


        /* =====================================================
           CUSTOM CURSOR
           
           IMPORTANT:
           left and top intentionally DO NOT have
           !important.

           This allows JavaScript to move the cursor.
        ====================================================== */

        @media (min-width: 769px) {

            html,
            body,
            html *,
            body * {
                cursor: none !important;
            }


            #dynamic-cursor {

                position: fixed !important;

                left: 0;
                top: 0;

                width: 40px !important;
                height: 40px !important;

                margin: 0 !important;
                padding: 0 !important;

                pointer-events: none !important;

                z-index: 999999 !important;

                font-family:
                    Arial,
                    Helvetica,
                    sans-serif !important;

                font-size: 2.5rem !important;

                font-weight: 900 !important;

                line-height: 40px !important;

                text-align: center !important;

                color: #ffffff !important;

                mix-blend-mode: difference !important;

                transform:
                    translate(-50%, -50%)
                    rotate(-135deg);

                transform-origin: center center !important;

                opacity: 1;

                display: block !important;

                transition:
                    transform 0.22s ease-out,
                    opacity 0.22s ease-out !important;
            }
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 768px) {

            .landing-header {
                height: 76px;
                padding: 18px 20px;
            }

            .logo-slot {
                width: 140px;
            }

            .menu-panel {
                width: 82%;
                min-width: 0;
                padding: 90px 28px 30px;
            }

            .menu-links {
                gap: 22px;
            }

            .menu-links a {
                font-size: 18px;
            }

            html,
            body,
            html *,
            body * {
                cursor: auto !important;
            }


            #dynamic-cursor {
                display: none !important;
            }


            .landing-widget {
                width: 100%;
                height: 100svh;
            }


            .landing-title {
                font-size: 10vw;

                max-width: 90vw;

                line-height: 0.95;

                margin-bottom: 40px;
            }


            .enlace-ovalo {
                top: calc(50% + 60px);
            }
        }


        /* =====================================================
           VERY SMALL SCREENS
        ====================================================== */

        @media (max-width: 480px) {

            .landing-title {
                font-size: 11vw;
            }

            .enlace-ovalo {
                top: calc(50% + 55px);
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         LANDING WIDGET
    ====================================================== -->

    <section class="landing-widget">

        <!-- =================================================
             HEADER
             Replace the logo-slot contents with your logo.
             ================================================== -->

        <header class="landing-header">
            <div class="logo-slot" aria-label="Logo">
                <!-- LOGO SLOT -->
            </div>

            <button
                class="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="site-menu"
            >
                <span></span>
                <span></span>
            </button>
        </header>

        <!-- =================================================
             GLASS MENU
             ================================================== -->

        <div class="menu-scrim" id="menu-scrim"></div>

        <aside class="menu-panel" id="site-menu" aria-hidden="true">
            <nav class="menu-links" aria-label="Main navigation">
                <a href="#work">Work</a>
                <a href="#about">About</a>
                <a href="#pricing">Pricing</a>
                <a href="#faq">Faq</a>
                <a href="#more">More</a>
            </nav>

            <div class="menu-social" aria-label="Social links">
                <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3.5" y="3.5" width="17" height="17" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.6" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
                    </svg>
                </a>

                <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg class="linkedin-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5.2 8.4H2.8V21h2.4V8.4ZM4 3a1.45 1.45 0 1 0 0 2.9A1.45 1.45 0 0 0 4 3Zm4.3 5.4H6V21h2.3v-6.6c0-1.8.35-3.5 2.55-3.5 2.17 0 2.2 2.02 2.2 3.62V21H15.4v-7.25c0-3.56-.77-6.25-4.5-6.25-1.42 0-2.37.78-2.76 1.52h-.03V8.4ZM17.6 8.4h-2.3V21h2.3v-6.24c0-1.65.31-3.86 2.8-3.86 2.45 0 2.47 2.44 2.47 3.98V21H23v-7.03c0-3.46-.74-6.47-4.73-6.47-1.6 0-2.67.88-3.1 1.71h-.03V8.4h-2.54Z"></path>
                    </svg>
                </a>
            </div>
        </aside>

        <!-- =================================================
             BACKGROUND VIDEO

             REPLACE THE URL BELOW
        ================================================== -->

<div class="landing-video">
    <iframe
        src="https://player.vimeo.com/video/1225816041?autoplay=1&muted=1&loop=1&background=1&autopause=0"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

        <!-- =================================================
             OVERLAY
        ================================================== -->

        <div class="landing-overlay"></div>


        <!-- =================================================
             CENTER CONTENT
        ================================================== -->

        <div class="landing-content">


            <!-- =============================================
                 TITLE

                 CHANGE THIS TEXT
            ============================================== -->

            <h1 class="landing-title">
    BESPOKE VISUALS<br>
    FOR<br>
    HIGH-VALUE INDUSTRIES
            </h1>


        </div>


        <!-- =================================================
             OVAL NAVIGATION
        ================================================== -->

        <a
            href="https://www.r25media.com/home#case-study"
            target="_top"
            class="enlace-ovalo"
            tabindex="0"
            aria-label="Go to case studies"
        >

            <div class="ovalo">

                <!-- Moving white dot -->
                <div class="punto-central">></div>

            </div>

        </a>


    </section>


    <!-- =====================================================
         CUSTOM CURSOR
    ====================================================== -->

    <div id="dynamic-cursor">&gt;</div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                const customCursor =
                    document.getElementById(
                        'dynamic-cursor'
                    );


                /*
                 * CUSTOM CURSOR
                 *
                 * Desktop only.
                 */

                if (customCursor) {

                    window.addEventListener(
                        'pointermove',
                        (e) => {

                            /*
                             * Move cursor to mouse position.
                             *
                             * clientX/clientY are correct because
                             * the cursor uses position: fixed.
                             */

                            customCursor.style.left =
                                `${e.clientX}px`;

                            customCursor.style.top =
                                `${e.clientY}px`;


                            /*
                             * Hide custom cursor when hovering
                             * over something clickable.
                             */

                            const clickable =
                                e.target.closest(
                                    'a, button, input, select, textarea, label, [role="button"]'
                                );


                            if (clickable) {

                                customCursor.style.transform =
                                'translate(-50%, -50%) rotate(45deg) scale(0.15)';

                                  customCursor.style.opacity =
                                  '0';

                                  return;
}

                            /*
                             * Normal landing-page state:
                             *
                             * White ">" rotated -135 degrees.
                             */

                            customCursor.textContent =
                                '>';

                            customCursor.style.transform =
                                 'translate(-50%, -50%) rotate(-135deg) scale(1)';

                            customCursor.style.opacity =
                                '1';

                        }
                    );


                    /*
                     * Hide cursor when mouse leaves
                     * the browser/page area.
                     */

                    document.documentElement.addEventListener(
                        'mouseleave',
                        () => {

                            customCursor.style.opacity =
                                '0';

                        }
                    );


                    /*
                     * Show cursor again when entering
                     * the page.
                     */

                    document.documentElement.addEventListener(
                        'mouseenter',
                        () => {

                            customCursor.style.opacity =
                                '1';

                        }
                    );

                }

                /*
                 * GLASS MENU
                 */

                const menuToggle = document.querySelector('.menu-toggle');
                const menuPanel = document.getElementById('site-menu');
                const menuScrim = document.getElementById('menu-scrim');

                function setMenu(open) {
                    if (!menuToggle || !menuPanel || !menuScrim) return;

                    menuToggle.classList.toggle('is-open', open);
                    menuPanel.classList.toggle('is-open', open);
                    menuScrim.classList.toggle('is-open', open);

                    menuToggle.setAttribute('aria-expanded', String(open));
                    menuToggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
                    menuPanel.setAttribute('aria-hidden', String(!open));
                    document.body.classList.toggle('menu-open', open);
                }

                if (menuToggle) {
                    menuToggle.addEventListener('click', () => {
                        setMenu(!menuPanel.classList.contains('is-open'));
                    });
                }

                if (menuScrim) {
                    menuScrim.addEventListener('click', () => setMenu(false));
                }

                if (menuPanel) {
                    menuPanel.querySelectorAll('a').forEach((link) => {
                        link.addEventListener('click', () => setMenu(false));
                    });
                }

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') setMenu(false);
                });

                /*
                 * BACKGROUND VIDEO
                 *
                 * Some browsers may block autoplay until
                 * playback is explicitly requested.
                 */

                const video =
                    document.querySelector(
                        '.landing-video'
                    );


                if (video) {

                    video.muted = true;

                    const playPromise =
                        video.play();


                    if (
                        playPromise !== undefined
                    ) {

                        playPromise.catch(
                            () => {

                                /*
                                 * Autoplay was blocked.
                                 * The video remains available,
                                 * but the browser requires user
                                 * interaction before playback.
                                 */

                            }
                        );

                    }

                }

            }
        );

    </script>


</body>
</html>
